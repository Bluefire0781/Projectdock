[package]
name = "api"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
thiserror = "1" #custom error creation
dotenvy = "0.15" # env files

#orm
migration = { path = "migration" }
sea-orm = { version = "2.0.0-34rc", features = [ "sqlx-postgres","runtime-tokio-native-tls", "macros" ] } # sea-orm"

#api/json
axum = "=0.8.8" #api
tokio = { version = "1.50.0", features = ["full"] } #async
tokio-stream = "0.1.18"
futures = "0.3.32"
reqwest = {version= "0.13.4", features = ["stream"]}
serde = { version = "1.0", features = ["derive"] } #JSON
serde_json = "1.0"            # for JSON handling

#middleware
tower-http = { version = "0.5", features = ["cors"] } # CORS middleware
tracing = "0.1" # tracing
tracing-subscriber = "0.3"    # logging/tracing

#pw encryption
argon2 = "0.5.3" # encryption
rand = "0.10.0" # rando

#JWT
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
chrono = { version = "0.4", features = ["clock", "serde"] } #time
chrono-tz = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
hyper = "1"
http-body-util = "0.1"
serde_json = "1"
