[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.8"
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"            # for JSON handling
tracing-subscriber = "0.3"    # logging/tracing
tower-http = { version = "0.4", features = ["cors"] } # CORS middleware
tracing = "0.1"
