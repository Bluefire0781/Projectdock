[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.8" #api
tokio = { version = "1.50.0", features = ["full"] } #async
serde = { version = "1.0", features = ["derive"] } # JSON
serde_json = "1.0"            # for JSON handling
tracing-subscriber = "0.3"    # logging/tracing
tower-http = { version = "0.4", features = ["cors"] } # CORS middleware
tracing = "0.1"
sea-orm = { version = "2.0.0-34", features = [ "sqlx-postgres","runtime-tokio-native-tls", "macros" ] } # sea-orm
